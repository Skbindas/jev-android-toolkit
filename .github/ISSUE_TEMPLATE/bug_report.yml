name: Bug report
description: Report a reproducible defect
title: "[bug] "
labels:
  - bug
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal reproducible steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
